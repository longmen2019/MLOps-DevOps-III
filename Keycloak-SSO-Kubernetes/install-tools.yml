---
- name: Prepare Jumpbox with basic tools
  hosts: jumpbox
  become: yes

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install base packages
      apt:
        name:
          - curl
          - git
          - unzip
        state: present
